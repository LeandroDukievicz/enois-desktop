appId: io.github.LeandroDukievicz.enois-desktop
productName: Énóis Desktop
asar: true
npmRebuild: false
afterPack: build/license-notices.mjs
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
directories:
  output: dist
  buildResources: assets
files:
  - out/**/*
  - assets/icons/**/*
  - package.json
  - LICENSE
linux:
  syncDesktopName: true
  executableName: enois-desktop
  category: Network
  icon: assets/icons/enois-desktop.png
  target:
    - target: snap
      arch: [x64]
  desktop:
    entry:
      Name: Énóis Desktop
      Comment: Projeto derivado e paralelo ao Énóis, independente para Linux
      StartupWMClass: enois-desktop
snapcraft:
  base: core22
  core22:
    allowNativeWayland: true
    title: Énóis Desktop
    summary: Cliente desktop independente do Énóis para Linux
    description: |
      Acesse a plataforma Énóis preservando sua interface original, com navegação
      desktop, sessão persistente e recuperação de conexão.
      Projeto derivado da experiência web do Énóis, desenvolvido de forma
      paralela e independente para Linux, sem afiliação oficial confirmada.
      Créditos pela plataforma, identidade visual e comunidade ao projeto
      original Énóis (https://enois.ia.br) e a seus criadores e colaboradores.
      O código deste cliente desktop é mantido por Leandro Dukievicz.
    confinement: strict
    grade: devel
    plugs:
      - network
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - opengl
      - audio-playback
      - home
      - browser-support:
          interface: browser-support
          allow-sandbox: true
