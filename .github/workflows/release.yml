name: Build release artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.0.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate version tag
        if: github.ref_type == 'tag'
        run: node scripts/check-release-tag.mjs
      - name: Prepare sandbox helper
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: pnpm check
      - run: pnpm audit --prod --audit-level high
      - run: pnpm build
      - run: xvfb-run -a -s '-screen 0 1440x1000x24' pnpm exec playwright test
      - name: Install Snap packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools
      - name: Build core22 snap with the verified template
        run: pnpm package:snap
      - name: Checksum and build metadata
        run: node scripts/build-metadata.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enois-desktop-linux
          path: |
            dist/*.snap
            dist/SHA256SUMS
            dist/build-info.json
          if-no-files-found: error
          retention-days: 14
      # No store upload or GitHub Release mutation. Promotion is a separate manual step.
