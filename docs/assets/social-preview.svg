<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Énóis Desktop — cliente independente para Linux</title>
  <desc id="description">Projeto derivado e paralelo à plataforma Énóis. Créditos à plataforma original e à sua comunidade.</desc>
  <rect width="1280" height="640" fill="#faf8ff"/>
  <path d="M850 0h430v640h-210C720 480 740 120 850 0Z" fill="#f0eafb"/>
  <circle cx="1126" cy="272" r="138" fill="#e7def8"/>
  <image href="data:image/svg+xml;base64," x="1022" y="168" width="208" height="208"/>
  <g font-family="Noto Sans, sans-serif">
    <rect x="64" y="70" width="251" height="38" rx="19" fill="#ede5f8"/>
    <text x="86" y="95" font-size="15" font-weight="600" letter-spacing="2" fill="#674098">LINUX · COMUNIDADE</text>
    <text x="64" y="260" font-size="66" font-weight="700" letter-spacing="-3" fill="#292032">Énóis <tspan font-weight="400" fill="#74568e">Desktop</tspan></text>
    <text x="64" y="325" font-size="22" fill="#665b73">Sua comunidade, em uma janela sua.</text>
    <text x="64" y="516" font-size="19" fill="#766782">Um projeto derivado e paralelo à plataforma Énóis.</text>
    <path d="M64 546H1216" stroke="#e1d8ed"/>
    <text x="64" y="592" font-size="16" fill="#8b7e97">Plataforma e comunidade originais: enois.ia.br</text>
    <text x="1216" y="592" font-size="16" text-anchor="end" fill="#674098">Cliente independente</text>
  </g>
</svg>
